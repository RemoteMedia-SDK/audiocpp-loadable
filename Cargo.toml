[package]
name = "audiocpp-loadable"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
remotemedia-plugin-sdk = { git = "https://github.com/RemoteMedia-SDK/remotemedia-plugin-sdk", rev = "44e02a9d24b1427cce48bc32ef837142787d0ba3" }
abi_stable = "0.11"
async-trait = "0.1"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.8"
dirs = "5"
tempfile = "3"
fs2 = "0.4"
schemars = "0.8"

[build-dependencies]
bindgen = "0.71"
