name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0)'
        required: true

jobs:
  release:
    uses: RemoteMedia-SDK/remotemedia-plugin-sdk/.github/workflows/build-plugin.yml@main
    with:
      crate-name:   audiocpp-loadable
      # Matches [plugin].name in plugin.toml; assets are libaudiocpp-{arch}-{os}.{ext}.
      # Manifests reference the release by repository: "audiocpp-loadable@vX.Y.Z".
      display-name: audiocpp
      # build.rs runs bindgen over native/audiocpp.h and native/manager.h.
      linux-apt-packages: libclang-dev
      tag:          ${{ inputs.tag || github.ref_name }}
    permissions:
      contents: write
